<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Link your key fob | TheLab</title>
  <link rel="icon" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/kiosk/style.css">
  <script src="/kiosk/app.js" defer></script>
</head>
<!-- Served on the LAN through the edge proxy, which authenticates fob claims. -->
<body>
  <main id="kiosk" data-state="ready">
    <svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="24" y="39" width="56" height="40" rx="8" transform="rotate(-12 52 59)"/><circle cx="39" cy="60" r="5"/><path d="M86 43a25 25 0 0 1 0 34M96 33a39 39 0 0 1 0 54"/></svg>
    <p id="status" role="status" aria-live="polite">Tap your fob</p>
    <div id="claim" role="dialog" aria-modal="true" aria-label="QR code to link your key fob" hidden>
      <div class="card">
        <button id="close" type="button" aria-label="Close">&times;</button>
        <img id="qr" alt="QR code to link your key fob">
      </div>
    </div>
  </main>
</body>
</html>
