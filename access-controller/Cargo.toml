[package]
name = "access-controller"
version = "0.1.0"
edition = "2021"

[dependencies]
heapless = "0.8"
log = "0.4"

esp-hal = { version = "1.0", features = ["esp32", "unstable", "rt"] }
esp-radio = { version = "0.17", default-features = false, features = ["esp32", "wifi", "smoltcp", "log-04", "unstable"] }
esp-rtos = { version = "0.2", features = ["esp32", "esp-radio", "embassy", "log-04"] }
esp-alloc = { version = "0.9", features = ["internal-heap-stats"] }
esp-println = { version = "0.13", default-features = false, features = ["esp32", "log", "uart"] }
esp-bootloader-esp-idf = "0.1"
esp-storage = { version = "0.6", features = ["esp32", "bytewise-read"] }
embedded-storage = "0.3"

# Use same embassy versions that esp-rtos uses
embassy-executor = "0.9"
embassy-time = "0.5"
embassy-sync = "0.7"
embassy-net = { version = "0.8", features = ["dhcpv4", "dhcpv4-hostname", "tcp", "medium-ethernet", "proto-ipv4"] }
embassy-futures = "0.1"

embedded-io-async = "0.7"
static_cell = "2"

# Override esp32 PAC to use the git version that esp-hal 1.0 was built against
[patch.crates-io]
esp32 = { git = "https://github.com/esp-rs/esp-pacs", rev = "5d7a479" }

[profile.release]
opt-level = "s"
lto = true

# esp-storage's ROM-call shims require opt-level >= 2 to inline correctly;
# building it at "s" panics at compile time.
[profile.release.package.esp-storage]
opt-level = 3
