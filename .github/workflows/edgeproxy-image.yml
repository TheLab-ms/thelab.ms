name: Edge proxy image

on:
  push:
    branches: [main]
    paths:
      - 'edgeproxy/**'
      - '.github/workflows/edgeproxy-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and publish linux/arm64 image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: edgeproxy
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/thelab-ms/conwayedge:latest
            ghcr.io/thelab-ms/conwayedge:${{ github.sha }}
