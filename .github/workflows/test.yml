name: Tests

on:
  push:
  pull_request:
  schedule:
    # Nightly at 06:17 UTC, away from the busy start of the hour.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    name: Site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Test Worker
        run: npm test
      - name: Test browser scripts
        run: npm run test:browser
      - name: Check Worker bundle
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker-build"

  edgeproxy:
    name: Edge proxy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: edgeproxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: edgeproxy/go.mod
          cache-dependency-path: edgeproxy/go.sum
      - name: Vet Go services
        run: go vet ./...
      - name: Test Go services with race detection
        run: go test -race -count=1 ./...

  access-controller-firmware:
    name: Access-controller ESP32 build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: access-controller
    steps:
      - uses: actions/checkout@v4
      - uses: esp-rs/xtensa-toolchain@v1.6
        with:
          buildtargets: esp32
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: access-controller
          shared-key: esp32-firmware
        env:
          RUSTUP_TOOLCHAIN: esp
      - name: Build release firmware
        env:
          CONWAY_SSID: ci
          CONWAY_PASSWORD: ci
          CONWAY_HOST: 192.0.2.1
        run: cargo +esp build --locked --release
